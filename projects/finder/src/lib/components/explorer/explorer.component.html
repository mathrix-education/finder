<mat-card>
  <div class="mat-h1 title">
    {{title}}
  </div>

  <div class="folders">
    <finder-element *ngFor="let element of elements"
                    [element]="element"
                    [selectedElement]="selected.indexOf(element) !== -1"
                    (navigate)="clicked.emit(element)"
                    (selectedElementChange)="selectionChange(element, $event)">
    </finder-element>
  </div>
</mat-card>
